# One-off: move the v0.8.6 tag onto the commit the release was actually built
# from. The tag was created against the earlier mislabelled tree, so a
# checkout of v0.8.6 gives 0.5.1 sources under a 0.8.6 manifest. Manual
# dispatch only, and deleted once it has run.
name: Retag v0.8.6

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Point v0.8.6 at main
        shell: bash
        run: |
          set -euo pipefail
          TARGET=$(git rev-parse HEAD)
          echo "main is $TARGET"

          # Refuse to move the tag anywhere that is not the real 0.8.6 tree.
          ID=$(python3 -c 'import json;print(json.load(open("manifest.json",encoding="utf-8"))["id"])')
          VERSION=$(python3 -c 'import json;print(json.load(open("manifest.json",encoding="utf-8"))["version"])')
          ENTRY=$(python3 -c 'import json;print(json.load(open("manifest.json",encoding="utf-8"))["entry"])')
          SPRITES=$(git ls-tree -r --name-only HEAD | grep -c '^assets/sprites/follower_')
          echo "id=$ID version=$VERSION entry=$ENTRY follower_sprites=$SPRITES"
          [ "$ID" = "PokePCFollowers" ]
          [ "$VERSION" = "0.8.6" ]
          [ "$ENTRY" = "main_sandbox.lua" ]
          [ "$SPRITES" -ge 400 ]

          OLD=$(git rev-parse "refs/tags/v0.8.6^{commit}" 2>/dev/null || echo none)
          echo "v0.8.6 currently $OLD"
          if [ "$OLD" = "$TARGET" ]; then
            echo "already correct; nothing to do"
            exit 0
          fi
          # Only ever fast-forward: the old target must be reachable from the
          # new one, so nothing becomes unreachable.
          if [ "$OLD" != "none" ]; then
            git merge-base --is-ancestor "$OLD" "$TARGET"
          fi

          git tag -f v0.8.6 "$TARGET"
          git push --force origin refs/tags/v0.8.6
          echo "v0.8.6 -> $(git rev-parse refs/tags/v0.8.6^{commit})"